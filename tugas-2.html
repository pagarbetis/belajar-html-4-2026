<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Belajar Tailwind</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <nav class="w-full fixed bg-white left-0 top-0 shadow-sm border-b border-gray-100 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        
        <!-- Logo -->
        <a href="#home" class="block">
          <img src="img/logo2.png" alt="Logo" class="h-16 w-auto" />
        </a>

        <!-- Menu Navigation -->
        <ul class="hidden md:flex items-center gap-8 font-semibold text-gray-600">
          <li>
            <a href="#home" class="inline-flex items-center hover:text-blue-600 transition">
              <!-- Pake mr-1 biar jarak ikon ke teks nge-lock presisi -->
              <i class="bi bi-list text-xl mr-1"></i>
              <span>Beranda</span>
            </a>
          </li>
          <li>
            <a href="#pengalaman" class="hover:text-blue-600 transition">Pengalaman</a>
          </li>
          <li>
            <a href="#kontak" class="hover:text-blue-600 transition">Kontak</a>
          </li>
          <li>
            <button class="font-bold outline-2 outline-red-500 rounded-sm py-3 px-6 shadow-sm">
              Info Pendaftaran Terbaru
            </button>
          </li>
        </ul>

      </div>
    </nav>
  </body>
</html>
